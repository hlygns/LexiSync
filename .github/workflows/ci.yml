name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build backend/LexiSync.slnx --configuration Release
      # The integration tests start their own PostgreSQL container (Testcontainers); Docker is preinstalled on the runner.
      - run: dotnet test backend/LexiSync.slnx --configuration Release --no-build

  mobile:
    name: Mobile typecheck, lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  e2e:
    name: Docker build and two-device sync tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      # Builds the API image from backend/Dockerfile and starts it next to PostgreSQL.
      - run: cp .env.example .env
      - run: docker compose up -d --build
      - name: Wait for the API
        run: |
          for i in $(seq 1 30); do
            curl -fs http://localhost:8080/health && exit 0
            sleep 2
          done
          docker compose logs api
          exit 1
      - run: npm ci
        working-directory: mobile
      # The real sync engine on two simulated devices against the API started above.
      - run: npm run test:e2e
        working-directory: mobile
